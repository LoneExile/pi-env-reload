name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: bun test

      - name: Verify package contents
        run: |
          set -euo pipefail
          npm pack --silent
          tar tzf pi-env-reload-*.tgz | tee /tmp/files.txt
          grep -qx 'package/extensions/env-reload.ts' /tmp/files.txt
          grep -qx 'package/package.json' /tmp/files.txt
          grep -qx 'package/README.md' /tmp/files.txt
          grep -qx 'package/CHANGELOG.md' /tmp/files.txt
          grep -qx 'package/LICENSE' /tmp/files.txt
          rm -f pi-env-reload-*.tgz
